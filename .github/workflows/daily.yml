name: daily-run

on:
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC = 17:00 JST (unchanged)
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'metaplanet_data.py'
      - 'sheet_sync.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/daily.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'sync repairs changed/missing dates; rebuild rewrites all available dates'
        type: choice
        options: [sync, rebuild]
        default: sync
        required: true

permissions:
  contents: read

# Do not interrupt a sheet write with another scheduled/manual run.
concurrency:
  group: meta-analysis-sheet
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Test source parsing and sheet synchronization
        run: python -m unittest discover -s tests -v

      - name: Restore history and update sheet
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          WORKSHEET_NAME: ${{ secrets.WORKSHEET_NAME }}
          GSA_JSON: ${{ secrets.GSA_JSON }}
          SYNC_MODE: ${{ inputs.mode || 'sync' }}
        run: python main.py --mode "$SYNC_MODE" --output-dir data

      - name: Keep source snapshot and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-snapshot-${{ github.run_id }}
          path: data/
          if-no-files-found: warn
          retention-days: 30
