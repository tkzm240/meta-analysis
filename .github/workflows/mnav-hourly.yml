name: mnav-hourly

on:
  schedule:
    - cron: '0 1-8 * * *'   # 01:00-08:00 UTC = 10:00-17:00 JST (unchanged)
  workflow_dispatch:
  workflow_run:
    workflows: [daily-run]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: mnav-hourly
  cancel-in-progress: false

jobs:
  build-graphs:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # Kaleido needs Chrome to export the PNG graphs.
      - uses: browser-actions/setup-chrome@v1
        id: chrome

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build report (generate docs and assets)
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          WORKSHEET_NAME: ${{ secrets.WORKSHEET_NAME }}
          GSA_JSON: ${{ secrets.GSA_JSON }}
          BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: python generate_mNAV_graph.py

      - name: Commit and push docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs assets README.md
          if git diff --cached --quiet; then
            echo "No report changes"
            exit 0
          fi
          git commit -m "Update docs by Actions"
          git pull --rebase origin main
          git push origin HEAD:main
